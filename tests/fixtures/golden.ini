version = 1

; =============================================================================
; Flags globaux — appliqués à tous les presets sauf surcharge locale
;
; device = Vulkan0 : backend par défaut. Les surcharges "device = ..." par
;   preset ci-dessous proviennent de bench-devices.conf (./setup-llm.sh --bench)
;   — chaque preset hérite du vainqueur mesuré sur son GGUF. Vérifier au
;   chargement dans les logs : device retenu + flash-attn effectivement actif
;   (certaines archs le coupent silencieusement sous HIP, ce qui annule le
;   gain de prefill).
; =============================================================================
[*]
device                 = Vulkan0
n-gpu-layers           = 99
cache-type-k           = q8_0
cache-type-v           = q4_0
flash-attn             = on
prio                   = 2
metrics                = true
slot-prompt-similarity = 0.5
cache-reuse            = 4096
presence-penalty       = 0.0

; =============================================================================
; Préchargement (load-on-startup) piloté par preload.conf
; (./setup-llm.sh --preload pour changer la sélection sans re-setup)
; =============================================================================

[qwen3.5-2b]
model            = /golden-home/models/qwen3.5-2b/Qwen3.5-2B-UD-Q4_K_XL.gguf
ctx-size         = 32768
cache-ram        = 2048
temp             = 0.7
top-k            = 20
top-p            = 0.8
min-p            = 0.0
parallel         = 4
swa-full         = true
ctx-checkpoints  = 128

[qwen3.5-9b]
model                = /golden-home/models/qwen3.5-9b/Qwen3.5-9B-UD-Q6_K_XL.gguf
ctx-size             = 32768
cache-ram            = 2048
temp                 = 0.7
top-k                = 20
top-p                = 0.8
min-p                = 0.0
chat-template-kwargs = {"enable_thinking":false}
n-predict            = 1024
parallel             = 4
swa-full             = true
ctx-checkpoints      = 128
load-on-startup  = true

[qwen3.6-35b-a3b-nothink]
model            = /golden-home/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q6_K_XL.gguf
ctx-size         = 524288
cache-ram        = 12288
reasoning        = off
temp             = 0.6
top-k            = 20
top-p            = 0.95
min-p            = 0.0
cache-type-v     = q8_0
parallel         = 2
cache-reuse      = 0
swa-full         = true
ctx-checkpoints  = 128
load-on-startup  = true

; =============================================================================
; À la demande — évincés par le LRU de --models-max
; =============================================================================

; --- Qwen3.5 9B MTP (bascule manuelle, parallel 1) ---

[qwen3.5-9b-mtp]
