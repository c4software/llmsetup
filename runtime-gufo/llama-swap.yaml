# =============================================================================
# llama-swap : routeur de modèles gufo (profil « routeur » de docker-compose.yml)
#
# Le client choisit le modèle par le champ « model », comme avec le routeur
# llama-server du service : llama-swap lance « gufo serve llm » pour ce modèle
# et arrête le précédent. Les deux ne tiennent pas ensemble en mémoire
# (Flash-Next ~100 Gio en 2 sessions, 27B ~45 Gio, 124 Gio en tout) : groupe
# exclusif, un seul à la fois. Bascule : 27B ~10 à 30 s, Flash-Next ~20 s
# (80 s à froid). Clients agentiques : faire pointer TOUS leurs rôles
# (principal et tâches annexes, le « Haiku » de Claude Code) sur le même
# modèle, sinon chaque requête annexe déclenche une bascule.
#
# Fichier VERSIONNÉ, sans valeur machine : les chemins et le nombre de
# sessions viennent de l'environnement du conteneur (${env.VAR}, posé par le
# compose depuis le .env que génère ./setup-llm.sh --gufo routeur). Les
# arguments de gufo sont ceux des profils 27b et flashnext du compose (mêmes
# fichiers, mêmes réglages, même origine : docs/GUFO.md) ; les garder
# identiques des deux côtés.
# =============================================================================

# Flash-Next à froid : ~80 s ; marge pour un disque chargé.
healthCheckTimeout: 300

# Jamais de messages « chargement en cours » dans le champ de raisonnement :
# un client agentique les prendrait pour du contenu.
sendLoadingState: false

# Journaux de llama-swap ET de gufo sur la sortie du conteneur :
# ./setup-llm.sh --gufo-logs y lit les lignes event=completed de gufo.
logToStdout: "both"

# Pas de déchargement sur inactivité : le dernier modèle reste servi, comme
# le routeur du service avec son préchargement.
globalTTL: 0

macros:
  # Partie commune de la ligne de commande de gufo (entrypoint des profils du
  # compose). gufo écoute en local, sur le port que llama-swap lui attribue.
  "gufo": >-
    gufo serve llm --host 127.0.0.1 --port ${PORT}
    --context 262144 --sessions ${env.GUFO_SESSIONS} --max-tokens 32768
    --cache-disk ${env.GUFO_DATA}/cache --cache-disk-bytes 17179869184
    --cache-disk-staging-bytes 8589934592
  # Échantillonnage officiel Qwen, profil instruct (sections nothink du service).
  "qwen": >-
    --temperature 0.7 --top-k 20 --top-p 0.8 --min-p 0.0
    --presence-penalty 1.5 --think off

models:
  # Le nom de modèle EST le --served-model-name de gufo : llama-swap transmet
  # la requête avec ce nom, gufo répond 404 model_not_found sinon.
  "qwen3.8-27b":
    name: "Qwen3.8-27B (gufo, DFlash 2)"
    cmd: >-
      ${gufo} --served-model-name qwen3.8-27b
      --model ${env.MODELS_BASE}/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --speculative dflash2
      --dflash-model ${env.MODELS_BASE}/qwen3.8-27b/Qwen3.8-27B-DFlash2-Q8_0.gguf
      ${qwen}
    checkEndpoint: /health
    # gufo refuse stop (OpenAI) et stop_sequences (Anthropic) en 400
    # unsupported_field (gufo-org/gufo#260) : retirés ici, pour tous les
    # clients, au lieu de perdre la requête.
    filters:
      stripParams: "stop, stop_sequences"

  "qwen3.8-flash-next":
    name: "Qwen3.8-Flash-Next (gufo, MTP)"
    cmd: >-
      ${gufo} --served-model-name qwen3.8-flash-next
      --model ${env.GUFO_DATA}/models/qwen3.8-flash-next/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
      --speculative mtp
      --mtp-model ${env.MODELS_BASE}/qwen3.8-flash-next/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
      --mmproj ${env.MODELS_BASE}/qwen3.8-flash-next/mmproj-BF16.gguf
      ${qwen}
    checkEndpoint: /health
    filters:
      stripParams: "stop, stop_sequences"

routing:
  router:
    use: group
    settings:
      groups:
        gufo:
          # Un seul membre à la fois (swap), et il décharge tout autre groupe.
          swap: true
          exclusive: true
          members:
            - "qwen3.8-27b"
            - "qwen3.8-flash-next"

hooks:
  on_startup:
    # Modèle chargé au démarrage du conteneur (préchargement) : GUFO_PRECHARGE
    # du .env, qwen3.8-flash-next par défaut.
    preload:
      - "${env.GUFO_PRECHARGE}"
