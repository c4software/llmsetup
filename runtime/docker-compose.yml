# =============================================================================
# Service llama-server : le conteneur du moteur ROCm Strix Halo
#
# Fichier VERSIONNÉ, source de vérité de la forme du service (montages,
# durcissement, ligne de commande du routeur, santé). Il ne porte AUCUNE valeur
# propre à une machine : tout ce qui varie d'un hôte à l'autre est une
# variable ${...}, lue dans le fichier ~/models/.env que ./setup-llm.sh écrit
# (lib/compose.sh, regen_env) à chaque --setup et à chaque --start. Chaque
# variable est OBLIGATOIRE (syntaxe ${VAR:?}) : un .env absent ou incomplet fait
# refuser le fichier par docker compose, avec le nom de la variable manquante,
# au lieu d'un service monté à moitié.
#
# Le .env porte aussi COMPOSE_FILE (chemin absolu de CE fichier) : c'est ce qui
# permet l'usage à la main, sans passer par le dépôt :
#   cd ~/models && docker compose ps | logs -f | build
#
# Régénérer le .env : ./setup-llm.sh --start (ou --restart, ou --setup).
# =============================================================================

# Nom de projet explicite : sans lui, compose nommerait le projet d'après le
# dossier de travail (« models »), et les conteneurs et réseaux s'appelleraient
# models-*.
name: llm-setup

services:
  llama:
    # container_name figé : tous les messages du dépôt nomment ce conteneur, et
    # _svc_is_active / _svc_wait_ready l'interrogent par docker inspect.
    container_name: ${SERVICE_NAME:?}
    image: ${IMAGE_REF:?}
    # Recette de l'image, ici et nulle part ailleurs : le Dockerfile vendorisé
    # du dépôt porte les deux révisions épinglées (ARG ENGINE_REV et
    # ROCM_SYSTEMS_REV), son git log est le journal des révisions.
    # « docker compose build » construit et pose le tag « image » ci-dessus ;
    # « docker compose up -d » NE construit PAS quand cette image existe déjà
    # (il ne construit que si elle manque), un démarrage ne déclenche donc
    # jamais une compilation de 40 minutes par surprise. lib/compose.sh refuse
    # de toute façon d'écrire le .env tant que l'image n'est pas là.
    # Le contexte est ABSOLU : un chemin relatif se résoudrait depuis le dossier
    # de projet (~/models), pas depuis ce fichier.
    build:
      context: ${RUNTIME_DIR:?}
      dockerfile: Dockerfile.rocm-strix
    # Image construite localement, jamais poussée nulle part : un pull ne peut
    # que échouer ou, pire, ramener autre chose.
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/llama-server"]
    # Transposition FIDÈLE de la ligne de commande de l'ancien service systemd.
    # --host 0.0.0.0 s'entend À L'INTÉRIEUR du conteneur (il faut écouter sur
    # toutes ses interfaces pour que la publication de port fonctionne) ;
    # l'exposition côté hôte est décidée par « ports » plus bas.
    # --models-max = modèles préchargés + 1 slot LRU pour le modèle appelé à la
    # demande (minimum 2), dérivé de preload.conf par regen_env : c'est la
    # seule valeur qui bouge au rythme des choix utilisateur, d'où la
    # réécriture du .env à chaque démarrage.
    # --models-autoload est le défaut côté llama-server, gardé explicite par
    # lisibilité.
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${SERVER_PORT:?}"
      - "--models-preset"
      - "${CONFIG_DIR:?}/models.ini"
      - "--models-max"
      - "${MODELS_MAX:?}"
      - "--models-autoload"
      - "--jinja"
    # PAS de bloc environment, et surtout PAS GGML_CUDA_ENABLE_UNIFIED_MEMORY
    # (que l'ancienne unité systemd posait pour le ROCm du système) : sur ce
    # runtime retained-PM4 il fait passer chaque allocation par
    # hipMallocManaged et la sortie se corrompt (charabia sans spéculation,
    # « init: invalid token » avec un draft MTP), cf. runtime/AMONT.md. Les
    # variables utiles (HSA_OVERRIDE_GFX_VERSION, DEBUG_HIP_GRAPH_PM4,
    # GPU_MAX_HW_QUEUES) sont déjà dans l'image. Toute la campagne de mesures
    # du 17/09/2026 a tourné sans cette variable.
    # Le routeur tourne avec l'uid et le gid de l'utilisateur du service (hôte,
    # résolus par regen_env), pas en root : rien dans l'image ne demande root,
    # les devices passent par les groupes render et video ci-dessous (kfd et
    # renderD128 sont en rw pour render, card0 pour video), ~/models est monté
    # en lecture seule et le seul point inscriptible (CACHE_DIR) appartient
    # déjà à cet utilisateur. Mesuré le 22/09/2026 : chargement, justesse et
    # débit identiques à root. Jusqu'à ce jour le processus était uid 0.
    user: "${SVC_UID:?}:${SVC_GID:?}"
    # Les deux seuls accès matériels dont le backend HIP a besoin.
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    # gid NUMÉRIQUES de render et video, résolus sur l'hôte par regen_env
    # (getent) : ces groupes n'existent pas dans l'image Fedora, leur NOM n'y
    # voudrait rien dire et docker le refuserait.
    group_add:
      - "${GID_RENDER:?}"
      - "${GID_VIDEO:?}"
    # Durcissement validé en exécution réelle le 17/09/2026 (cf. _dk_run) :
    # seccomp=unconfined est EXIGÉ par ROCr (ioctl du KFD hors profil docker
    # par défaut) ; il est compensé par no-new-privileges et le retrait de
    # toutes les capabilities, qui ne coûtent rien au moteur.
    # Jamais privileged, jamais docker.sock, jamais network_mode: host.
    security_opt:
      - "seccomp=unconfined"
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # llama.cpp mmap les poids et épingle des buffers : les défauts docker
    # (64 Mio de /dev/shm, memlock bas) font échouer le chargement des gros GGUF.
    shm_size: 8g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # Pas de mem_limit : la garde mémoire du dépôt (_ensure_room_for) raisonne
    # sur le « available » de l'HÔTE et décharge des modèles par l'API du
    # routeur. Un plafond cgroup ferait tuer le routeur par l'OOM killer du
    # groupe avant que la garde n'ait la main - exactement ce qu'elle évite.
    # BIND_ADDR vaut 0.0.0.0 par défaut (ce que faisait l'unité systemd) ;
    # 127.0.0.1 restreint l'exposition à la machine.
    ports:
      - "${BIND_ADDR:?}:${SERVER_PORT:?}:${SERVER_PORT:?}"
    volumes:
      # MÊME chemin absolu des deux côtés : models.ini porte des chemins
      # absolus de l'hôte et ne doit surtout pas être réécrit pour le
      # conteneur. En lecture seule : le moteur n'a rien à écrire dans les poids.
      - "${MODELS_BASE:?}:${MODELS_BASE:?}:ro"
      # Seul point inscriptible, hors de ~/models : place d'un futur cache
      # disque du moteur. Créé par regen_env s'il manque.
      - "${CACHE_DIR:?}:/var/cache/llama:rw"
    # 180 s : l'arrêt du routeur (déchargement des préchargés) dépassait le
    # délai par défaut de systemd, qui le tuait au SIGKILL. SIGINT est le
    # signal d'arrêt propre de llama-server.
    stop_grace_period: 180s
    stop_signal: SIGINT
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Sonde sans curl : l'image est bâtie sur fedora-minimal, qui n'en a pas.
    # bash sait ouvrir une socket TCP (/dev/tcp) et lire la ligne de statut.
    # start_period 300 s : le préchargement d'un gros parc prend des minutes,
    # et un conteneur déclaré unhealthy pendant ce temps-là n'apprend rien.
    healthcheck:
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/${SERVER_PORT:?} && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
