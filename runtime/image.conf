# runtime/image.conf — épinglage de l'image moteur ROCm (VERSIONNÉ).
#
# Contrairement aux .conf de la racine (bench-devices.conf, fork.conf…) qui sont
# des choix de machine, celui-ci fait partie du dépôt : c'est lui qui rend une
# image reproductible d'une machine à l'autre, et un changement de révision se
# relit dans l'historique git à côté des mesures qui l'ont motivé.
#
# Format clé=valeur, lu par _image_read_conf (lib/runtime.sh) et par personne
# d'autre. Pas de guillemets, pas d'espace autour du =, une clé par ligne.
#
# *_REV vide = HEAD de la branche au moment du build (le build reste daté par le
# tag et tracé dans logs/images.tsv, mais deux builds ne donnent plus la même
# image). Rempli = révision exacte, checkout détaché dans le Dockerfile.
# Les modifier à la main est prévu ; ./setup-llm.sh --image-update les réécrit.
#
# Révisions du 17/09/2026 : celles de l'image construite à la main ce soir-là
# (llama-rocm-10.0-strix-llama:pr133), mesurée sur bigchuck avant la migration.

ENGINE_REPO=https://github.com/halo-box/strix-llama.cpp.git
ENGINE_BRANCH=master
ENGINE_REV=8c1c282ecb194e8f02613defcc4a07c22b6d1c08

ROCM_SYSTEMS_REPO=https://github.com/pwilkin/rocm-systems.git
ROCM_SYSTEMS_BRANCH=ilintar-experiments
ROCM_SYSTEMS_REV=7dda3ac6cfe6bbe0b7f08c23a67cfa118d8641a1

# Nom de l'image locale. Le tag n'est pas ici : il est fixe (`latest`, cf.
# lib/runtime.sh). Ce qu'une image contient se lit dans ses LABEL et dans
# /opt/strix/versions.txt, pas dans son tag ; l'historique des révisions, lui,
# est le git log de CE fichier.
IMAGE_NAME=llm-rocm-strix
