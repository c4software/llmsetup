# =============================================================================
# Service sd-server : génération d'images avec stable-diffusion.cpp (Vulkan)
#
# Même contrat que runtime/docker-compose.yml pour le parc LLM : fichier
# VERSIONNÉ, source de vérité de la forme du service (montages, durcissement,
# ligne de commande, santé), sans AUCUNE valeur propre à une machine. Tout ce
# qui varie d'un hôte à l'autre, et les chemins des poids déclarés dans
# image/setup-image.sh, sont des variables ${VAR:?} lues dans le fichier
# ~/models/image/.env que ./image/setup-image.sh écrit (regen_env) à chaque
# --setup et à chaque --start. Une variable manquante fait refuser le fichier
# par docker compose, avec son nom, au lieu d'un service monté à moitié.
#
# Le .env porte aussi COMPOSE_FILE (chemin absolu de CE fichier), d'où l'usage
# à la main, sans passer par le dépôt :
#   cd ~/models/image && docker compose ps | logs -f
#
# Différences avec le compose LLM, et pourquoi :
#   - image PUBLIÉE (ghcr.io/leejet/stable-diffusion.cpp:master-vulkan), pas
#     construite : pull_policy missing, et c'est --setup / --update qui tire
#     (le tag glissant suit master amont, l'étiquette de moteur des journaux
#     vient du label OCI de l'image, cf. _sd_build) ;
#   - backend Vulkan (RADV embarqué dans l'image) : /dev/dri suffit, pas de
#     /dev/kfd, et pas de seccomp=unconfined (exigé par ROCr seulement) ;
#   - le conteneur tourne sous l'uid/gid de l'utilisateur : sd-server écrit les
#     images produites dans /output, elles doivent lui appartenir.
# =============================================================================

name: llm-setup-image

services:
  sd:
    # container_name figé : les messages du dépôt le nomment, et
    # _svc_is_active / _svc_wait_ready l'interrogent par docker inspect.
    container_name: ${SERVICE_NAME:?}
    image: ${IMAGE_REF:?}
    pull_policy: missing
    restart: unless-stopped
    entrypoint: ["/sd-server"]
    # --listen-ip 0.0.0.0 s'entend À L'INTÉRIEUR du conteneur ; l'exposition
    # côté hôte est décidée par « ports » plus bas.
    # Sampling : --cfg-scale 6.0 et --sampling-method euler, valeurs de la doc
    # sd.cpp pour Qwen-Image-2.1 (docs/qwen_image_2.1.md) ; --diffusion-fa :
    # flash attention dans le DiT. Les poids viennent du .env, déclarés une
    # seule fois dans image/setup-image.sh (téléchargement ET service).
    command:
      - "--diffusion-model"
      - "${DIT_PATH:?}"
      - "--vae"
      - "${VAE_PATH:?}"
      - "--llm"
      - "${LLM_PATH:?}"
      - "--llm_vision"
      - "${LLM_VISION_PATH:?}"
      - "--cfg-scale"
      - "6.0"
      - "--sampling-method"
      - "euler"
      - "--diffusion-fa"
      - "--listen-ip"
      - "0.0.0.0"
      - "--listen-port"
      - "${SERVER_PORT:?}"
    # Le seul accès matériel dont RADV a besoin.
    devices:
      - "/dev/dri:/dev/dri"
    # uid/gid de l'utilisateur (les PNG de /output lui appartiennent) plus les
    # gid NUMÉRIQUES de render et video, résolus sur l'hôte par regen_env :
    # ces groupes n'existent pas dans l'image Ubuntu, leur NOM n'y voudrait
    # rien dire. Sans eux, pas d'accès à /dev/dri/renderD128, donc pas de GPU.
    user: "${RUN_UID:?}:${RUN_GID:?}"
    group_add:
      - "${GID_RENDER:?}"
      - "${GID_VIDEO:?}"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
    ports:
      - "${BIND_ADDR:?}:${SERVER_PORT:?}:${SERVER_PORT:?}"
    volumes:
      # MÊME chemin absolu des deux côtés, en lecture seule : les chemins du
      # .env sont ceux de l'hôte, valables tels quels dans le conteneur.
      - "${MODELS_BASE:?}:${MODELS_BASE:?}:ro"
      # Seul point inscriptible : les images produites.
      - "${OUTPUT_DIR:?}:/output:rw"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Sonde sans curl (l'image Ubuntu minimale n'en a pas) : bash ouvre une
    # socket TCP et lit la ligne de statut de /v1/models. start_period 120 s :
    # le chargement des 17 Go de poids prend du temps.
    healthcheck:
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/${SERVER_PORT:?} && printf 'GET /v1/models HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
